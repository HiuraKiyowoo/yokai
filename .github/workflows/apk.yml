name: apk
on:
  push:
    branches: [build-baseline]
  workflow_dispatch:
    inputs:
      hanya_ekstensi:
        description: 'Lewati build aplikasi, cukup ekstensi'
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" "build-tools;35.0.0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Build ekstensi Wibutime
        run: |
          set -o pipefail
          ./gradlew :extensions:wibutime:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee ext.log
      - name: Build aplikasi
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.hanya_ekstensi == false }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleStandardNightly --no-daemon --stacktrace --console=plain 2>&1 | tee app.log
      - name: Ringkas galat
        if: always()
        run: |
          { grep -nE "error:|FAILURE:|What went wrong|Caused by:|Could not|e: file" ext.log app.log 2>/dev/null | head -60; echo "----- ekor ext -----"; tail -30 ext.log 2>/dev/null; } > err.txt 2>&1 || true
      - name: Unggah galat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: err
          path: err.txt
      - name: Unggah ekstensi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ext-wibutime
          path: extensions/wibutime/build/outputs/apk/release/*.apk
          if-no-files-found: warn
      - name: Unggah APK aplikasi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-yokai
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn