name: apk
on:
  push:
    branches: [build-baseline]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Android SDK
        run: |
          yes | "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties
          cat ~/.gradle/gradle.properties
      - name: Rekam CI
        run: echo "JAVA_HOME=$JAVA_HOME" && java -version 2>&1
      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleStandardNightly --no-daemon --stacktrace --console=plain 2>&1 | tee build.log
      - name: Ringkas galat
        if: always()
        run: |
          { grep -nE "error:|FAILURE:|What went wrong|Caused by:|Could not|e: file" build.log | head -60; echo "----- ekor -----"; tail -30 build.log; } > err.txt 2>&1 || true
      - name: Unggah galat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: err
          path: err.txt
      - name: Unggah APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-yokai
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
