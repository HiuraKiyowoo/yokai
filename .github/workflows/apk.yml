name: apk
on:
  push:
    branches: [build-baseline]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" "build-tools;35.0.0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Build aplikasi
        run: |
          set -o pipefail
          ./gradlew :app:assembleStandardNightly --no-daemon --stacktrace --console=plain 2>&1 | tee app.log
      - name: Ringkas galat
        if: always()
        run: |
          {
            echo "===== What went wrong ====="; grep -A 25 "What went wrong" app.log 2>/dev/null
            echo "===== error ====="; grep -nE "^e: file.*yokai|error:|Cannot|Unresolved|FAILURE" app.log 2>/dev/null | head -40
            echo "===== ekor ====="; tail -25 app.log 2>/dev/null
          } > err.txt 2>&1 || true
      - name: Unggah galat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: err
          path: err.txt
      - name: Unggah APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-yokai
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
      # Tag tetap "apk-terbaru": URL unduhannya tidak berubah antar build,
      # jadi tidak perlu masuk halaman Actions tiap kali.
      - name: Terbitkan APK ke Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view apk-terbaru > /dev/null 2>&1 \
            || gh release create apk-terbaru --title "APK terbaru (build-baseline)" \
                 --notes "APK hasil build otomatis cabang build-baseline. Varian arm64-v8a untuk HP Android 64-bit."
          for f in app/build/outputs/apk/standard/nightly/*.apk; do
            gh release upload apk-terbaru "$f" --clobber
          done