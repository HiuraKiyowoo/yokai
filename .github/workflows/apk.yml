name: apk
on:
  push:
    branches: [build-baseline]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" "build-tools;35.0.0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Build aplikasi
        run: |
          set -o pipefail
          ./gradlew :app:assembleStandardNightly --no-daemon --stacktrace --console=plain 2>&1 | tee app.log
      - name: Ringkas galat
        if: always()
        run: |
          {
            echo "===== What went wrong ====="; grep -A 25 "What went wrong" app.log 2>/dev/null
            echo "===== error ====="; grep -nE "^e: file.*yokai|error:|Cannot|Unresolved|FAILURE" app.log 2>/dev/null | head -40
            echo "===== ekor ====="; tail -25 app.log 2>/dev/null
          } > err.txt 2>&1 || true
      - name: Unggah galat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: err
          path: err.txt
      - name: Unggah APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-yokai
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
      # Tag tetap "apk-terbaru": URL unduhannya tidak berubah antar build,
      # jadi tidak perlu masuk halaman Actions tiap kali.
      #
      # Versi & catatan rilis diperbarui SETIAP build supaya orang yang membuka
      # halaman rilis tahu ini build apa dan apa yang berubah:
      #   judul  -> "Yokai v1.10.3-r6450"  (angka r = git rev-list --count HEAD,
      #             sama dengan versionNameSuffix "-r${commitCount}" di build.gradle)
      #   isi    -> versi + commit + tanggal + daftar commit terakhir
      - name: Siapkan catatan rilis
        id: rilis
        run: |
          HITUNG=$(git rev-list --count HEAD)
          VERSI="v1.10.3-r${HITUNG}"
          echo "versi=$VERSI" >> "$GITHUB_OUTPUT"
          {
            echo "**Versi:** \`${VERSI}\` · commit [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) · $(date -u '+%d %b %Y %H:%M UTC')"
            echo
            echo "**Perubahan di build ini:**"
            echo
            git log -n 12 --pretty=format:"- %s" | sed 's/^/- /'
            echo
            echo
            echo "---"
            echo
            echo "Aset utama: **\`app-standard-arm64-v8a-nightly.apk\`** (HP Android 64-bit / arm64-v8a)."
            echo "Aset lain: \`armeabi-v7a\` (HP 32-bit), \`universal\` (semua ABI), \`x86\`/\`x86_64\` (emulator)."
            echo
            echo "Aplikasi memeriksa pembaruan sendiri dengan membandingkan waktu unggah aset di rilis ini"
            echo "dengan waktu paket terpasang, jadi begitu build ini selesai versi lama akan menawarkan"
            echo "pembaruan (Setelan → Tentang → pembaruan)."
          } > catatan-rilis.md
      - name: Terbitkan APK ke Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view apk-terbaru > /dev/null 2>&1; then
            gh release edit apk-terbaru \
              --title "Yokai ${{ steps.rilis.outputs.versi }}" \
              --notes-file catatan-rilis.md
          else
            gh release create apk-terbaru \
              --title "Yokai ${{ steps.rilis.outputs.versi }}" \
              --notes-file catatan-rilis.md \
              --target build-baseline
          fi
          for f in app/build/outputs/apk/standard/nightly/*.apk; do
            gh release upload apk-terbaru "$f" --clobber
          done