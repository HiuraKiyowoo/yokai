name: apk
on:
  push:
    branches: [build-baseline]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties','gradle/libs.versions.toml') }}
      - name: Siapkan Android SDK 36 + NDK
        run: |
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Build APK
        run: ./gradlew :app:assembleStandardDebug --no-daemon --stacktrace
      - name: Unggah APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-baseline
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
